name: Refresh GitHub activity

# Commits fresh data for the /now page, and that push triggers a Vercel deploy.
# A failed fetch stops here, so the site keeps its last good data.
on:
  schedule:
    - cron: '0 18 * * *' # 2am Singapore time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-github
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch GitHub data
        run: node scripts/fetch-github.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit if changed
        run: |
          git diff --quiet -- src/data/github.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/github.json
          git commit -m 'chore: refresh GitHub activity'
          git push
